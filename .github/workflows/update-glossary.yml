name: Update Glossary Data

on:
  # Hourly backup to the `backups` branch — no branch protection needed
  schedule:
    - cron: '0 * * * *'

  # Manual trigger — also runs the publish job if PAT is configured
  workflow_dispatch:
    inputs:
      publish:
        description: 'Bump version and publish to main (requires GLOSSARY_PAT secret)'
        type: boolean
        default: false

jobs:
  # ── Hourly backup ────────────────────────────────────────────────────────────
  # Pushes latest glossary JSON to the `backups` branch.
  # This branch has no protection rules so GITHUB_TOKEN can push directly.
  backup:
    runs-on: linux-arm64
    permissions:
      contents: write

    steps:
      - name: Checkout backups branch
        uses: actions/checkout@v4
        with:
          ref: backups
          token: ${{ secrets.GITHUB_TOKEN }}
          # If the branch doesn't exist yet, create it from main
          fetch-depth: 0

      - name: Fetch glossary data from API
        run: |
          echo "Fetching from https://translate.monta.app/public/api/glossary"
          curl -f https://translate.monta.app/public/api/glossary -o glossary-data.json

          # Pretty-print
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('glossary-data.json', 'utf8'));
            fs.writeFileSync('glossary-data.json', JSON.stringify(data, null, 2));
            console.log('Terms:', data.terms ? data.terms.length : 'n/a');
          "

      - name: Commit and push to backups branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add glossary-data.json

          if git diff --cached --quiet; then
            echo "No changes — glossary is unchanged since last snapshot."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
            TERMS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('glossary-data.json','utf8')).terms.length)")
            git commit -m "snapshot: ${TIMESTAMP} (${TERMS} terms)"
            git push origin backups
            echo "✅ Snapshot saved: ${TIMESTAMP}"
          fi

  # ── Publish to main + npm ────────────────────────────────────────────────────
  # Bumps the package version, updates src/glossary-data.json on main, creates a
  # GitHub release. Requires the GLOSSARY_PAT secret (a PAT with repo:write that
  # is exempt from branch protection on main).
  publish:
    runs-on: linux-arm64
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GLOSSARY_PAT }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Fetch glossary data from API
        run: |
          echo "Fetching from https://translate.monta.app/public/api/glossary"
          curl -f https://translate.monta.app/public/api/glossary -o src/glossary-data.json
          node -e "const fs = require('fs'); const d = JSON.parse(fs.readFileSync('src/glossary-data.json','utf8')); fs.writeFileSync('src/glossary-data.json', JSON.stringify(d, null, 2)); console.log('Terms:', d.terms.length)"

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet src/glossary-data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat src/glossary-data.json
          fi

      - name: Configure git
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and bump version
        if: steps.check_changes.outputs.changed == 'true'
        id: version
        run: |
          git add src/glossary-data.json
          git commit -m "Update glossary data from API"
          npm version patch -m "chore: update glossary data to v%s"
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Push to main
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git push origin main
          git push origin --tags

      - name: Create GitHub Release
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GLOSSARY_PAT }}
        run: |
          TERMS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/glossary-data.json','utf8')).terms.length)")
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "Glossary data updated — ${TERMS} terms."
